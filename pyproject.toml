[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xcontracts"
version = "0.1.0"
description = "Port contracts and a conformance kit for Xorchestrate adapters"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "xormania" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/xormania/xcontracts"
Changelog = "https://github.com/xormania/xcontracts/blob/master/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.16.8", "build>=1.2,<2", "setuptools>=77"]

[tool.setuptools.packages.find]
include = ["xcontracts*"]

[tool.setuptools.package-data]
xcontracts = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
